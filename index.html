<title>Statistiche pallavolo</title>

<style>
/* Layout: a one-screen match console (roster, then six big action keys) with a totals table underneath. */
:root {
  --bg: #EEF2F5;
  --surface: #FFFFFF;
  --ink: #13222D;
  --muted: #566672;
  --line: #CFD9E1;
  --accent: #0F5C8E;
  --accent-ink: #FFFFFF;
  --tint: #DCEBF6;
  --good: #166A3E;
  --good-bg: #E1F3E9;
  --good-line: #A9D6BC;
  --bad: #A82A24;
  --bad-bg: #FBE6E4;
  --bad-line: #EDB5B0;
  --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D151B; --surface: #16212A; --ink: #E6EDF2; --muted: #92A3AF; --line: #2A3A47;
    --accent: #5DB3E8; --accent-ink: #06202F; --tint: #17303F;
    --good: #6FE0A3; --good-bg: #14301F; --good-line: #25563A;
    --bad: #FF9A91; --bad-bg: #3A1816; --bad-line: #6A2C28;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D151B; --surface: #16212A; --ink: #E6EDF2; --muted: #92A3AF; --line: #2A3A47;
  --accent: #5DB3E8; --accent-ink: #06202F; --tint: #17303F;
  --good: #6FE0A3; --good-bg: #14301F; --good-line: #25563A;
  --bad: #FF9A91; --bad-bg: #3A1816; --bad-line: #6A2C28;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.4 var(--font-body);
  padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top > div { min-width: 0; }
h1 { margin: 0; font: 700 30px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand > div { min-width: 0; }
.logo { width: 56px; height: 56px; flex: none; border-radius: 8px; }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
h2 { margin: 0; font: 700 20px/1.1 var(--font-display); letter-spacing: .04em; text-transform: uppercase; }
h3 { margin: 0 0 6px; font: 600 12px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

.btn {
  min-height: 44px; padding: 0 16px; border-radius: 10px;
  background: var(--surface); border: 1.5px solid var(--line); font-weight: 600;
}
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger.armed { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }

.sets { display: flex; gap: 8px; flex-wrap: wrap; }
.sets button {
  flex: 1; max-width: 140px; min-height: 44px; padding: 0 14px; border-radius: 999px;
  background: var(--surface); border: 1.5px solid var(--line);
  font: 700 18px/1 var(--font-display); letter-spacing: .04em; text-transform: uppercase;
}
.sets button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.sechead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.sechead .btn { min-height: 38px; padding: 0 12px; font-size: 14px; }

.match { display: flex; flex-direction: column; gap: 6px; }
.match label { font: 600 12px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.match input {
  width: 100%; min-height: 48px; padding: 0 12px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--surface); font-size: 17px;
}

.roster { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.chip {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 52px; padding: 4px 2px; border-radius: 10px; min-width: 0;
  background: var(--surface); border: 1.5px solid var(--line);
}
.chip .no { font: 700 21px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.chip .nm { font-size: 10px; line-height: 1.1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] .nm { color: var(--accent-ink); opacity: .85; }
.roster.edit { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.editcell { display: flex; gap: 6px; min-width: 0; }
.editcell input {
  min-height: 44px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--surface); padding: 0 10px; min-width: 0;
}
.editcell .in-n { width: 56px; flex: none; text-align: center; font: 700 22px/1 var(--font-display); }
.editcell .in-name { flex: 1; font-size: 15px; }

.actions { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.key {
  display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 6px;
  min-height: 84px; padding: 10px 12px; border-radius: 12px; text-align: left; border: 1.5px solid;
}
.pair .key:only-child { grid-column: 1 / -1; }
.key .lab { font-weight: 600; font-size: 15px; line-height: 1.15; }
.key .num { font: 700 38px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.key.good { background: var(--good-bg); border-color: var(--good-line); color: var(--good); }
.key.bad { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); }
.key:active { transform: scale(.97); }
.key.hit { animation: pop .18s ease-out; }
@keyframes pop { 0% { transform: scale(.95); } 100% { transform: scale(1); } }

.tablewrap { overflow-x: auto; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font: 600 12px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
th.l, td.l { text-align: left; }
th.good { color: var(--good); }
th.bad { color: var(--bad); }
td.l.name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
td.zero { color: var(--muted); opacity: .55; }
tbody tr.sel td { background: var(--tint); }
tbody tr:last-child td { border-bottom: 0; }
tr.total td { font-weight: 700; border-top: 2px solid var(--ink); background: var(--bg); }
.legend { margin: 10px 0 0; font-size: 13px; color: var(--muted); }

.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { min-height: 38px; padding: 0 14px; border: 0; background: transparent; font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.foot { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.status { flex-basis: 100%; margin: 0; font-size: 14px; color: var(--muted); min-height: 20px; }
#paste { width: 100%; min-height: 120px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); padding: 10px; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }

@media (min-width: 600px) {
  .roster { gap: 8px; }
  .chip { min-height: 62px; padding: 6px 4px; border-radius: 12px; }
  .chip .no { font-size: 28px; }
  .chip .nm { font-size: 12px; }
  .roster.edit { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (min-width: 720px) {
  .actions { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  h1 { font-size: 36px; }
}
@media (prefers-reduced-motion: reduce) {
  .key.hit { animation: none; }
  .key:active { transform: none; }
}
</style>

</head>

    <input id="match" type="text" maxlength="60" placeholder="Es. 28/10 contro Azzurra" autocomplete="off">
  </div>

  <div class="sets" id="sets" role="group" aria-label="Set in corso"></div>

  <section aria-labelledby="h-roster">
    <div class="sechead">
      <h2 id="h-roster">Giocatori</h2>
      <button type="button" class="btn" id="editToggle">Modifica nomi</button>
    </div>
    <div class="roster" id="roster"></div>
  </section>

  <section aria-labelledby="selTitle">
    <div class="sechead"><h2 id="selTitle"></h2></div>
    <div class="actions" id="actions"></div>
  </section>

  <section aria-labelledby="h-tot">
    <div class="sechead">
      <h2 id="h-tot">Totali</h2>
      <div class="seg" id="scope" role="group" aria-label="Periodo dei totali"></div>
    </div>
    <div class="tablewrap"><table id="tbl"></table></div>
    <p class="legend">BV battuta vincente · EB errore battuta · RB ricezione buona · RE ricezione errata · AV attacco vincente · AE attacco errato · PT punto</p>
  </section>

  <section class="foot" aria-label="Esporta e azzera">
    <button type="button" class="btn primary" id="save" hidden>Salva file CSV</button>
    <button type="button" class="btn primary" id="copy">Copia per Excel</button>
    <button type="button" class="btn danger" id="reset">Azzera partita</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <textarea id="paste" hidden readonly aria-label="Dati da copiare"></textarea>
  </section>
</div>

<script>
(function () {
  var ACTIONS = [
    { id: 'bv', grp: 'Battuta',   label: 'Battuta vincente', short: 'BV', kind: 'good' },
    { id: 'eb', grp: 'Battuta',   label: 'Errore battuta',   short: 'EB', kind: 'bad' },
    { id: 'rb', grp: 'Ricezione', label: 'Ricezione buona',  short: 'RB', kind: 'good' },
    { id: 're', grp: 'Ricezione', label: 'Ricezione errata', short: 'RE', kind: 'bad' },
    { id: 'av', grp: 'Attacco',   label: 'Attacco vincente', short: 'AV', kind: 'good' },
    { id: 'ae', grp: 'Attacco',   label: 'Attacco errato',   short: 'AE', kind: 'bad' },
    { id: 'pt', grp: 'Punto',     label: 'Punto',            short: 'PT', kind: 'good' }
  ];
  var GROUPS = ['Battuta', 'Ricezione', 'Attacco', 'Punto'];
  var IDS = ACTIONS.map(function (a) { return a.id; });
  var N = 13, MAXSET = 3, STORE = 'pallavolo-u14-stats-v1';

  var st = { players: [], events: [], set: 1, sel: 0, match: '' };
  var dl = null;
  for (var i = 0; i < N; i++) st.players.push({ n: String(i + 1), name: '' });
  var ui = { scope: 'set', edit: false, armed: false, timer: null, hit: null };

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function actionById(id) { return ACTIONS.filter(function (a) { return a.id === id; })[0]; }

  function load() {
    try {
      var raw = localStorage.getItem(STORE);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (!d || !Array.isArray(d.players) || d.players.length < 12 || d.players.length > N || !Array.isArray(d.events)) return;
      st.players = d.players.map(function (p, i) {
        return { n: String(p && p.n != null ? p.n : i + 1).slice(0, 2), name: String((p && p.name) || '').slice(0, 24) };
      });
      while (st.players.length < N) st.players.push({ n: String(st.players.length + 1), name: '' });
      st.match = String(d.match || '').slice(0, 60);
      st.events = d.events.filter(function (e) {
        return e && e.p >= 0 && e.p < N && IDS.indexOf(e.a) > -1 && e.s >= 1 && e.s <= MAXSET;
      });
      if (d.set >= 1 && d.set <= MAXSET) st.set = d.set;
      if (d.sel >= 0 && d.sel < N) st.sel = d.sel;
    } catch (e) {}
  }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(st)); } catch (e) {} }

  function tally(setNum) {
    var t = st.players.map(function () {
      var o = {}; IDS.forEach(function (id) { o[id] = 0; }); return o;
    });
    st.events.forEach(function (e) {
      if (setNum && e.s !== setNum) return;
      t[e.p][e.a]++;
    });
    return t;
  }
  function pname(p) { return (p.n ? '#' + p.n : '#–') + (p.name ? ' ' + p.name : ''); }

  function renderTop() {
    $('sets').innerHTML = [1, 2, 3].map(function (s) {
      return '<button type="button" data-set="' + s + '" aria-pressed="' + (s === st.set) + '">Set ' + s + '</button>';
    }).join('');
    var last = st.events[st.events.length - 1];
    $('undo').disabled = !last;
    $('last').textContent = last
      ? 'Ultima: ' + pname(st.players[last.p]) + ' · ' + actionById(last.a).label + ' · Set ' + last.s
      : 'Tocca un giocatore, poi l’azione.';
  }

  function renderRoster() {
    var el = $('roster');
    el.className = 'roster' + (ui.edit ? ' edit' : '');
    $('editToggle').textContent = ui.edit ? 'Fatto' : 'Modifica nomi';
    if (ui.edit) {
      el.innerHTML = st.players.map(function (p, i) {
        return '<div class="editcell">' +
          '<input class="in-n" id="n' + i + '" data-i="' + i + '" data-f="n" inputmode="numeric" maxlength="2" value="' + esc(p.n) + '" aria-label="Numero maglia giocatore ' + (i + 1) + '">' +
          '<input class="in-name" id="m' + i + '" data-i="' + i + '" data-f="name" maxlength="24" placeholder="Nome" value="' + esc(p.name) + '" aria-label="Nome giocatore ' + (i + 1) + '">' +
          '</div>';
      }).join('');
    } else {
      el.innerHTML = st.players.map(function (p, i) {
        return '<button type="button" class="chip" data-p="' + i + '" aria-pressed="' + (i === st.sel) + '">' +
          '<span class="no">' + esc(p.n || '–') + '</span>' +
          '<span class="nm">' + (p.name ? esc(p.name) : '&nbsp;') + '</span></button>';
      }).join('');
    }
  }

  function renderActions() {
    var focused = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute('data-act');
    var p = st.players[st.sel];
    var t = tally(st.set)[st.sel];
    $('selTitle').textContent = pname(p) + ' · Set ' + st.set;
    $('actions').innerHTML = GROUPS.map(function (g) {
      return '<div class="group"><h3>' + g + '</h3><div class="pair">' +
        ACTIONS.filter(function (a) { return a.grp === g; }).map(function (a) {
          return '<button type="button" class="key ' + a.kind + (ui.hit === a.id ? ' hit' : '') + '" data-act="' + a.id + '">' +
            '<span class="lab">' + a.label + '</span><span class="num">' + t[a.id] + '</span></button>';
        }).join('') + '</div></div>';
    }).join('');
    ui.hit = null;
    if (focused) {
      var again = $('actions').querySelector('[data-act="' + focused + '"]');
      if (again) again.focus({ preventScroll: true });
    }
  }

  function renderTable() {
    var scopeSet = ui.scope === 'set' ? st.set : null;
    $('scope').innerHTML =
      '<button type="button" data-scope="set" aria-pressed="' + (ui.scope === 'set') + '">Set ' + st.set + '</button>' +
      '<button type="button" data-scope="all" aria-pressed="' + (ui.scope === 'all') + '">Partita</button>';
    var t = tally(scopeSet);
    var tot = {}; IDS.forEach(function (id) { tot[id] = 0; });
    var head = '<thead><tr><th class="l">N.</th><th class="l">Nome</th>' +
      ACTIONS.map(function (a) { return '<th class="' + a.kind + '" title="' + a.label + '">' + a.short + '</th>'; }).join('') + '</tr></thead>';
    var rows = st.players.map(function (p, i) {
      return '<tr' + (i === st.sel ? ' class="sel"' : '') + '><td class="l">' + esc(p.n || '–') + '</td>' +
        '<td class="l name">' + (p.name ? esc(p.name) : '<span style="opacity:.5">–</span>') + '</td>' +
        ACTIONS.map(function (a) {
          var v = t[i][a.id]; tot[a.id] += v;
          return '<td' + (v ? '' : ' class="zero"') + '>' + v + '</td>';
        }).join('') + '</tr>';
    }).join('');
    var foot = '<tr class="total"><td class="l" colspan="2">Squadra</td>' +
      ACTIONS.map(function (a) { return '<td>' + tot[a.id] + '</td>'; }).join('') + '</tr>';
    $('tbl').innerHTML = head + '<tbody>' + rows + foot + '</tbody>';
  }

  function renderAll() { renderTop(); renderRoster(); renderActions(); renderTable(); }

  function say(msg) { $('status').textContent = msg; }

  function buildRows() {
    var match = st.match.trim();
    var rows = [['Partita', 'Set', 'N.', 'Nome'].concat(ACTIONS.map(function (a) { return a.label; }))];
    var blocks = [];
    for (var s = 1; s <= MAXSET; s++) {
      if (st.events.some(function (e) { return e.s === s; })) blocks.push([String(s), tally(s)]);
    }
    blocks.push(['Totale', tally(null)]);
    blocks.forEach(function (b) {
      st.players.forEach(function (p, i) {
        rows.push([match, b[0], p.n, p.name].concat(ACTIONS.map(function (a) { return b[1][i][a.id]; })));
      });
    });
    return rows;
  }
  function buildTSV() {
    return buildRows().map(function (r) {
      return r.map(function (c) { return String(c).replace(/[\t\r\n]+/g, ' '); }).join('\t');
    }).join('\n');
  }
  function buildCSV() {
    var q = function (c) { c = String(c); return /[;"\r\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; };
    return '﻿' + buildRows().map(function (r) { return r.map(q).join(';'); }).join('\r\n') + '\r\n';
  }
  function fileName() {
    var base = st.match.replace(/[\\\/:*?"<>|\u0000-\u001f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80);
    if (!base) {
      var d = new Date(), z = function (n) { return ('0' + n).slice(-2); };
      base = 'Partita ' + d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
    }
    return base + '.csv';
  }
  function saveCsv() {
    if (!dl) return;
    var name = fileName();
    dl.save({ filename: name, data: buildCSV() }).then(function () {
      say('File salvato: ' + name);
    }, function (err) {
      var code = err && err.code;
      if (code === 'declined') say('Salvataggio annullato.');
      else if (code === 'rate_limited') say('Attendi un attimo e riprova.');
      else say('Salvataggio non disponibile qui. Usa “Copia per Excel”.');
    });
  }

  function copyData() {
    var text = buildTSV();
    var ta = $('paste');
    var ok = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          ta.hidden = true;
          say('Copiato. Incolla in Excel o Fogli Google.');
        }, fallback);
        ok = true;
      }
    } catch (e) { ok = false; }
    if (!ok) fallback();
    function fallback() {
      ta.hidden = false; ta.value = text; ta.focus(); ta.select();
      say('Il testo è selezionato qui sotto: copialo a mano e incollalo in Excel o Fogli Google.');
    }
  }

  function disarm() { ui.armed = false; clearTimeout(ui.timer); var b = $('reset'); b.textContent = 'Azzera partita'; b.classList.remove('armed'); }

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('button') : null;
    if (!b) return;
    if (b.hasAttribute('data-p')) { st.sel = +b.getAttribute('data-p'); save(); renderAll(); return; }
    if (b.hasAttribute('data-act')) {
      st.events.push({ p: st.sel, a: b.getAttribute('data-act'), s: st.set });
      ui.hit = b.getAttribute('data-act'); save(); renderAll(); return;
    }
    if (b.hasAttribute('data-set')) { st.set = +b.getAttribute('data-set'); save(); renderAll(); return; }
    if (b.hasAttribute('data-scope')) { ui.scope = b.getAttribute('data-scope'); renderTable(); return; }
    if (b.id === 'undo') { st.events.pop(); save(); renderAll(); return; }
    if (b.id === 'editToggle') { ui.edit = !ui.edit; renderRoster(); return; }
    if (b.id === 'copy') { copyData(); return; }
    if (b.id === 'save') { saveCsv(); return; }
    if (b.id === 'reset') {
      if (!ui.armed) {
        ui.armed = true; b.textContent = 'Conferma: cancella tutto'; b.classList.add('armed');
        ui.timer = setTimeout(disarm, 5000);
        say('Salva prima il file CSV: azzerare cancella le statistiche e il nome della partita.');
      } else {
        st.events = []; st.set = 1; st.match = ''; $('match').value = '';
        disarm(); save(); renderAll(); $('paste').hidden = true; say('Partita azzerata. I nomi dei giocatori sono rimasti.');
      }
    }
  });

  $('roster').addEventListener('input', function (ev) {
    var t = ev.target, i = +t.getAttribute('data-i'), f = t.getAttribute('data-f');
    if (!f || !(i >= 0)) return;
    if (f === 'n') { t.value = t.value.replace(/\D/g, '').slice(0, 2); st.players[i].n = t.value; }
    else { st.players[i].name = t.value.slice(0, 24); }
    save(); renderTop(); renderTable();
    $('selTitle').textContent = pname(st.players[st.sel]) + ' · Set ' + st.set;
  });

  $('match').addEventListener('input', function (ev) {
    st.match = ev.target.value.slice(0, 60);
    save();
  });

  load();
  $('match').value = st.match;
  renderAll();

  dl = {
    save: function (req) {
      return new Promise(function (resolve, reject) {
        try {
          var url = URL.createObjectURL(new Blob([req.data], { type: 'text/csv;charset=utf-8' }));
          var a = document.createElement('a');
          a.href = url; a.download = req.filename;
          document.body.appendChild(a); a.click();
          setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
          resolve({ status: 'saved' });
        } catch (e) { reject({ code: 'unavailable' }); }
      });
    }
  };
  $('save').hidden = false;
  $('copy').classList.remove('primary');

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
